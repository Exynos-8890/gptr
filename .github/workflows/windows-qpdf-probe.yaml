name: Windows qpdf check preflight
on:
  push:
    branches: [perf/windows-ci-validation]
    paths: [.github/workflows/windows-qpdf-probe.yaml]
permissions:
  contents: read
jobs:
  qpdf:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: oldrel-4
          rtools-version: none
      - name: Admit qpdf for PDF checks
        shell: pwsh
        run: ./dev/ci/windows/setup-qpdf.ps1
      - name: Prove old R finds and uses the PDF checker
        shell: Rscript --vanilla {0}
        run: |
          qpdf = Sys.which(Sys.getenv("R_QPDF", "qpdf"))
          stopifnot(nzchar(qpdf))
          path = tempfile(fileext = ".pdf")
          grDevices::pdf(path)
          graphics::plot(seq_len(100L))
          grDevices::dev.off()
          tools::compactPDF(path, verbose = TRUE)
          status = system2(qpdf, c("--check", shQuote(path)))
          stopifnot(identical(status, 0L), file.info(path)$size > 0)
