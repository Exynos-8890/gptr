name: Windows production candidate validation
'on':
  push:
    branches:
      - perf/windows-ci-validation
    paths:
      - .github/workflows/windows-candidate.yaml
permissions:
  contents: read
jobs:
  windows:
    uses: ./.github/workflows/Windows-check.yaml
  cran-mode:
    runs-on: ubuntu-latest
    name: candidate serial CRAN mode (devel)
    timeout-minutes: 120
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: false
      _R_CHECK_THINGS_IN_OTHER_DIRS_: true
      _R_CHECK_CRAN_INCOMING_: false
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: devel
          http-user-agent: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
      - name: Prepare exact Linux suite-root evidence
        if: runner.os == 'Linux'
        shell: bash
        run: |
          gptr_root_evidence="$RUNNER_TEMP/gptr-test-root-evidence"
          mkdir -m 700 "$gptr_root_evidence"
          printf 'GPTR_TEST_ROOT_EVIDENCE=%s\nGPTR_TEST_ROOT_READER=%s\nGPTR_TEST_ROOT_PYTHON=%s\n' \
            "$gptr_root_evidence" "$GITHUB_WORKSPACE/dev/ci/test-root-teardown-readback.py" \
            /usr/bin/python3 >> "$GITHUB_ENV"
      - uses: r-lib/actions/check-r-package@v2
        with:
          build_args: c("--no-manual", "--compact-vignettes=gs+qpdf")
          args: c("--no-manual", "--as-cran")
          error-on: '"warning"'
      - name: Observe exact Linux suite roots and check-child exit
        if: always() && runner.os == 'Linux'
        shell: bash
        run: |
          /usr/bin/python3 -I -B dev/ci/test-root-teardown-readback.py \
            child-exit "$RUNNER_TEMP/gptr-test-root-evidence"
      - name: Retain Linux suite-root teardown evidence
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-suite-root-cran-mode
          path: ${{ runner.temp }}/gptr-test-root-evidence
          if-no-files-found: error
          retention-days: 5
      - name: Fail unless R CMD check wrote its status
        run: grep '^Status:' check/gptr.Rcheck/00check.log
