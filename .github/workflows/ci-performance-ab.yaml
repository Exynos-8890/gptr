name: CI performance A-B (CRAN checks retained)
'on':
  push:
    branches:
      - ci/perf-cran-*
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }}) / ${{ matrix.config.variant
      || matrix.variant || 'optimized' }} / ${{ matrix.config.policy || 'ci' }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        config:
          - os: macos-latest
            r: release
            variant: optimized
            policy: ci
          - os: windows-latest
            r: release
            minutes: 120
            variant: optimized
            policy: ci
          - os: windows-latest
            r: oldrel-4
            things-in-other-dirs: 'false'
            minutes: 120
            variant: optimized
            policy: ci
          - os: ubuntu-latest
            r: devel
            http-user-agent: release
            minutes: 120
            variant: optimized
            policy: ci
          - os: ubuntu-latest
            r: release
            variant: optimized
            policy: ci
          - os: ubuntu-latest
            r: oldrel-1
            variant: optimized
            policy: ci
          - os: ubuntu-latest
            r: oldrel-4
            variant: optimized
            policy: ci
          - os: windows-latest
            r: oldrel-4
            things-in-other-dirs: 'false'
            minutes: 120
            variant: baseline
            policy: ci
          - os: ubuntu-latest
            r: release
            variant: baseline
            policy: ci
          - os: ubuntu-latest
            r: devel
            http-user-agent: release
            minutes: 120
            variant: optimized
            policy: cran
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: true
      _R_CHECK_THINGS_IN_OTHER_DIRS_: ${{ matrix.config.things-in-other-dirs || 'true'
        }}
      _R_CHECK_CRAN_INCOMING_: false
      NOT_CRAN: ${{ matrix.config.policy == 'cran' && 'false' || 'true' }}
      GPTR_CI_PERF_VARIANT: ${{ matrix.config.variant || matrix.variant || 'optimized'
        }}
      OMP_THREAD_LIMIT: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
      RCPP_PARALLEL_NUM_THREADS: '1'
      TESTTHAT_CPUS: '2'
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        id: windows_python
        if: runner.os == 'Windows'
        with:
          python-version: 3.12.10
      - name: Provision the Windows private numerical Python and admit its native
          library
        if: runner.os == 'Windows'
        shell: bash
        env:
          GPTR_BASE_PYTHON: ${{ steps.windows_python.outputs.python-path }}
        run: |
          "$GPTR_BASE_PYTHON" - <<'PY'
          import hashlib, json, os, pathlib, subprocess, sys
          assert sys.version_info[:3] == (3, 12, 10)
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'gptr-rscript-python'
          assert not root.exists(), 'Private Python directory must be fresh'
          root.mkdir(mode=0o700)
          subprocess.run([sys.executable, '-m', 'venv', str(root)], check=True, timeout=120)
          executable = root / ('Scripts/python.exe' if os.name == 'nt' else 'bin/python')
          assert executable.is_file()
          subprocess.run([str(executable), '-m', 'pip', 'install', '--only-binary=:all:',
                          'numpy==2.3.4', 'pandas==2.3.3'], check=True, timeout=180)
          query = """
          import hashlib, json, os, pathlib, sys, sysconfig
          base = pathlib.Path(sys.base_prefix).resolve(strict=True)
          prefix = pathlib.Path(sys.prefix).resolve(strict=True)
          assert base != prefix and sys.version_info[:3] == (3, 12, 10)
          version = f'{sys.version_info.major}.{sys.version_info.minor}'
          if os.name == 'nt':
              candidates = [base / f'python{version.replace(".", "")}.dll']
          else:
              name = sysconfig.get_config_var('LDLIBRARY')
              directory = sysconfig.get_config_var('LIBDIR')
              assert isinstance(name, str) and name and isinstance(directory, str) and directory
              extension = '.dylib' if sys.platform == 'darwin' else '.so'
              candidates = [pathlib.Path(directory) / name, base / pathlib.Path(name).name,
                            base / 'lib' / f'libpython{version}{extension}']
          libraries = {path.resolve(strict=True) for path in candidates if path.is_file()}
          assert len(libraries) == 1, 'Exactly one canonical native library must be admitted'
          library = libraries.pop()
          assert os.path.normcase(os.path.commonpath([str(library), str(base)])) == \
              os.path.normcase(str(base)) and library != base
          size = library.stat().st_size
          assert 0 < size <= 64 * 1024 * 1024
          digest = hashlib.sha256()
          count = 0
          with library.open('rb') as stream:
              while True:
                  chunk = stream.read(1024 * 1024)
                  if not chunk:
                      break
                  count += len(chunk)
                  assert count <= 64 * 1024 * 1024
                  digest.update(chunk)
          assert count == size == library.stat().st_size
          result = json.dumps(dict(python=os.path.abspath(sys.executable), prefix=str(prefix),
              base_prefix=str(base), library=str(library), sha256=digest.hexdigest(),
              library_bytes=count, version='.'.join(map(str, sys.version_info[:3]))))
          assert len(result.encode('utf-8')) <= 4096
          print(result)
          """
          process = subprocess.run([str(executable), '-I', '-c', query], check=True, timeout=10,
                                   stdout=subprocess.PIPE, stderr=subprocess.PIPE)
          assert not process.stderr and len(process.stdout) <= 4096
          witness = json.loads(process.stdout)
          assert list(witness) == ['python', 'prefix', 'base_prefix', 'library', 'sha256',
                                   'library_bytes', 'version']
          assert witness['version'] == '3.12.10'
          settings = dict(RETICULATE_PYTHON=str(executable), RETICULATE_USE_MANAGED_VENV='false',
              GPTR_PY_NATIVE_PREFIX=str(root), GPTR_PY_NATIVE_VERSION='3.12.10',
              GPTR_NP_NATIVE_VERSION='2.3.4', GPTR_PD_NATIVE_VERSION='2.3.3',
              GPTR_PY_NATIVE_LIBPYTHON=witness['library'], GPTR_PY_NATIVE_LIB_SHA256=witness['sha256'])
          assert all('\n' not in value and '\r' not in value for value in settings.values())
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              for key, value in settings.items():
                  output.write(key + '=' + value + '\n')
          evidence = pathlib.Path(os.environ['RUNNER_TEMP']) / 'gptr-check-python-evidence'
          evidence.mkdir(exist_ok=True)
          (evidence / 'python-admission.json').write_text(json.dumps(witness, indent=2),
                                                         encoding='utf-8')
          PY
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
          cache: always
      - name: Isolate checker temporary files on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          gptr_check_tmp=$(mktemp -d "$RUNNER_TEMP/gptr-check-tmp.XXXXXX")
          chmod 700 "$gptr_check_tmp"
          printf 'TMPDIR=%s\nTMP=%s\nTEMP=%s\n' \
            "$gptr_check_tmp" "$gptr_check_tmp" "$gptr_check_tmp" >> "$GITHUB_ENV"
      - name: Prepare exact Linux suite-root evidence
        if: runner.os == 'Linux'
        shell: bash
        run: |
          gptr_root_evidence="$RUNNER_TEMP/gptr-test-root-evidence"
          mkdir -m 700 "$gptr_root_evidence"
          printf 'GPTR_TEST_ROOT_EVIDENCE=%s\nGPTR_TEST_ROOT_READER=%s\nGPTR_TEST_ROOT_PYTHON=%s\n' \
            "$gptr_root_evidence" "$GITHUB_WORKSPACE/dev/ci/test-root-teardown-readback.py" \
            /usr/bin/python3 >> "$GITHUB_ENV"
      - name: Prepare measured candidate (same assertions)
        shell: bash
        run: Rscript --vanilla dev/ci/perf-prepare.R
      - name: Measured check
        shell: bash
        run: '"${{ steps.windows_python.outputs.python-path || ''/usr/bin/python3''
          }}" dev/ci/perf-launch.py Rscript --vanilla dev/ci/perf-run.R check'
      - name: Observe exact Linux suite roots and check-child exit
        if: always() && runner.os == 'Linux'
        shell: bash
        run: |
          /usr/bin/python3 -I -B dev/ci/test-root-teardown-readback.py \
            child-exit "$RUNNER_TEMP/gptr-test-root-evidence"
      - name: Retain Linux suite-root teardown evidence
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-suite-root-${{ matrix.config.r }}-${{ matrix.config.variant
            || matrix.variant || 'optimized' }}-${{ matrix.config.policy || 'ci' }}
          path: ${{ runner.temp }}/gptr-test-root-evidence
          if-no-files-found: error
          retention-days: 5
      - name: Fail unless R CMD check wrote its status
        shell: bash
        run: grep '^Status:' check/gptr.Rcheck/00check.log
      - name: Retain the Windows numerical Python admission
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-python-admission-${{ matrix.config.r }}-${{ matrix.config.variant
            || matrix.variant || 'optimized' }}-${{ matrix.config.policy || 'ci' }}
          path: |
            ${{ runner.temp }}/gptr-check-python-evidence/python-admission.json
            check/gptr.Rcheck/00check.log
            check/gptr.Rcheck/tests/native-*.Rout*
            check/gptr.Rcheck/tests/testthat.Rout*
          if-no-files-found: error
          retention-days: 5
      - name: Collect comparable test evidence
        if: always()
        shell: bash
        run: Rscript --vanilla dev/ci/perf-collect.R
      - name: Retain timing and test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: perf-R-CMD-check-${{ matrix.config.os || runner.os }}-${{ matrix.config.r
            || matrix.r || 'release' }}-${{ matrix.config.variant || matrix.variant
            || 'optimized' }}-${{ matrix.config.policy || 'ci' }}
          path: perf-evidence
          if-no-files-found: error
          retention-days: 7.0
  no-suggests:
    runs-on: ubuntu-latest
    name: ubuntu-latest (release, no Suggests) / ${{ matrix.config.variant || matrix.variant
      || 'optimized' }} / ${{ matrix.config.policy || 'ci' }}
    timeout-minutes: 120
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      _R_CHECK_FORCE_SUGGESTS_: false
      _R_CHECK_CRAN_INCOMING_: false
      GPTR_CI_PERF_VARIANT: ${{ matrix.config.variant || matrix.variant || 'optimized'
        }}
      OMP_THREAD_LIMIT: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
      RCPP_PARALLEL_NUM_THREADS: '1'
      TESTTHAT_CPUS: '2'
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: any::rcmdcheck any::testthat any::knitr any::rmarkdown
          needs: check
          cache: always
      - name: Prepare exact Linux suite-root evidence
        if: runner.os == 'Linux'
        shell: bash
        run: |
          gptr_root_evidence="$RUNNER_TEMP/gptr-test-root-evidence"
          mkdir -m 700 "$gptr_root_evidence"
          printf 'GPTR_TEST_ROOT_EVIDENCE=%s\nGPTR_TEST_ROOT_READER=%s\nGPTR_TEST_ROOT_PYTHON=%s\n' \
            "$gptr_root_evidence" "$GITHUB_WORKSPACE/dev/ci/test-root-teardown-readback.py" \
            /usr/bin/python3 >> "$GITHUB_ENV"
      - name: Prepare measured candidate (same assertions)
        shell: bash
        run: Rscript --vanilla dev/ci/perf-prepare.R
      - name: Measured check
        shell: bash
        run: '"${{ steps.windows_python.outputs.python-path || ''/usr/bin/python3''
          }}" dev/ci/perf-launch.py Rscript --vanilla dev/ci/perf-run.R check'
      - name: Observe exact Linux suite roots and check-child exit
        if: always() && runner.os == 'Linux'
        shell: bash
        run: |
          /usr/bin/python3 -I -B dev/ci/test-root-teardown-readback.py \
            child-exit "$RUNNER_TEMP/gptr-test-root-evidence"
      - name: Retain Linux suite-root teardown evidence
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-suite-root-noSuggests-${{ matrix.config.variant || matrix.variant
            || 'optimized' }}-${{ matrix.config.policy || 'ci' }}
          path: ${{ runner.temp }}/gptr-test-root-evidence
          if-no-files-found: error
          retention-days: 5
      - name: Fail unless R CMD check wrote its status
        run: grep '^Status:' check/gptr.Rcheck/00check.log
      - name: Collect comparable test evidence
        if: always()
        shell: bash
        run: Rscript --vanilla dev/ci/perf-collect.R
      - name: Retain timing and test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: perf-no-suggests-${{ matrix.config.os || runner.os }}-${{ matrix.config.r
            || matrix.r || 'release' }}-${{ matrix.config.variant || matrix.variant
            || 'optimized' }}-${{ matrix.config.policy || 'ci' }}
          path: perf-evidence
          if-no-files-found: error
          retention-days: 7.0
  c-locale:
    runs-on: ubuntu-latest
    name: ubuntu-latest (release, LC_ALL=C) / ${{ matrix.config.variant || matrix.variant
      || 'optimized' }} / ${{ matrix.config.policy || 'ci' }}
    timeout-minutes: 120
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      LC_ALL: C
      LANG: C
      _R_CHECK_CRAN_INCOMING_: false
      GPTR_CI_PERF_VARIANT: ${{ matrix.config.variant || matrix.variant || 'optimized'
        }}
      OMP_THREAD_LIMIT: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
      RCPP_PARALLEL_NUM_THREADS: '1'
      TESTTHAT_CPUS: '2'
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
          cache: always
      - name: Prepare exact Linux suite-root evidence
        if: runner.os == 'Linux'
        shell: bash
        run: |
          gptr_root_evidence="$RUNNER_TEMP/gptr-test-root-evidence"
          mkdir -m 700 "$gptr_root_evidence"
          printf 'GPTR_TEST_ROOT_EVIDENCE=%s\nGPTR_TEST_ROOT_READER=%s\nGPTR_TEST_ROOT_PYTHON=%s\n' \
            "$gptr_root_evidence" "$GITHUB_WORKSPACE/dev/ci/test-root-teardown-readback.py" \
            /usr/bin/python3 >> "$GITHUB_ENV"
      - name: Prepare measured candidate (same assertions)
        shell: bash
        run: Rscript --vanilla dev/ci/perf-prepare.R
      - name: Measured check
        shell: bash
        run: '"${{ steps.windows_python.outputs.python-path || ''/usr/bin/python3''
          }}" dev/ci/perf-launch.py Rscript --vanilla dev/ci/perf-run.R check'
      - name: Observe exact Linux suite roots and check-child exit
        if: always() && runner.os == 'Linux'
        shell: bash
        run: |
          /usr/bin/python3 -I -B dev/ci/test-root-teardown-readback.py \
            child-exit "$RUNNER_TEMP/gptr-test-root-evidence"
      - name: Retain Linux suite-root teardown evidence
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-suite-root-locale-C-${{ matrix.config.variant || matrix.variant
            || 'optimized' }}-${{ matrix.config.policy || 'ci' }}
          path: ${{ runner.temp }}/gptr-test-root-evidence
          if-no-files-found: error
          retention-days: 5
      - name: Fail unless R CMD check wrote its status
        run: grep '^Status:' check/gptr.Rcheck/00check.log
      - name: Collect comparable test evidence
        if: always()
        shell: bash
        run: Rscript --vanilla dev/ci/perf-collect.R
      - name: Retain timing and test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: perf-c-locale-${{ matrix.config.os || runner.os }}-${{ matrix.config.r
            || matrix.r || 'release' }}-${{ matrix.config.variant || matrix.variant
            || 'optimized' }}-${{ matrix.config.policy || 'ci' }}
          path: perf-evidence
          if-no-files-found: error
          retention-days: 7.0
  copy-safety:
    runs-on: ubuntu-latest
    name: copy-safety (${{ matrix.r }}) / ${{ matrix.config.variant || matrix.variant
      || 'optimized' }} / ${{ matrix.config.policy || 'ci' }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        r:
          - release
          - devel
        variant:
          - optimized
        include:
          - r: release
            variant: baseline
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      GPTR_CI_PERF_VARIANT: ${{ matrix.config.variant || matrix.variant || 'optimized'
        }}
      OMP_THREAD_LIMIT: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
      RCPP_PARALLEL_NUM_THREADS: '1'
      TESTTHAT_CPUS: '2'
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::devtools
          cache: always
      - name: Prepare measured candidate (same assertions)
        shell: bash
        run: Rscript --vanilla dev/ci/perf-prepare.R
      - name: Measured copy
        shell: bash
        run: '"${{ steps.windows_python.outputs.python-path || ''/usr/bin/python3''
          }}" dev/ci/perf-launch.py Rscript --vanilla dev/ci/perf-run.R copy'
      - name: Collect comparable test evidence
        if: always()
        shell: bash
        run: Rscript --vanilla dev/ci/perf-collect.R
      - name: Retain timing and test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: perf-copy-safety-${{ matrix.config.os || runner.os }}-${{ matrix.config.r
            || matrix.r || 'release' }}-${{ matrix.config.variant || matrix.variant
            || 'optimized' }}-${{ matrix.config.policy || 'ci' }}
          path: perf-evidence
          if-no-files-found: error
          retention-days: 7.0
  connections:
    runs-on: ubuntu-latest
    name: connections left open / ${{ matrix.config.variant || matrix.variant || 'optimized'
      }} / ${{ matrix.config.policy || 'ci' }}
    timeout-minutes: 120
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      GPTR_CI_PERF_VARIANT: ${{ matrix.config.variant || matrix.variant || 'optimized'
        }}
      OMP_THREAD_LIMIT: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
      RCPP_PARALLEL_NUM_THREADS: '1'
      TESTTHAT_CPUS: '2'
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::devtools
          cache: always
      - name: Prove the connection gate detects a leak
        run: Rscript --vanilla -e 'testthat::test_file("dev/ci/test-check-connections.R",
          stop_on_failure = TRUE)'
      - name: Prepare measured candidate (same assertions)
        shell: bash
        run: Rscript --vanilla dev/ci/perf-prepare.R
      - name: Measured connections
        shell: bash
        run: '"${{ steps.windows_python.outputs.python-path || ''/usr/bin/python3''
          }}" dev/ci/perf-launch.py Rscript --vanilla dev/ci/perf-run.R connections'
      - name: Collect comparable test evidence
        if: always()
        shell: bash
        run: Rscript --vanilla dev/ci/perf-collect.R
      - name: Retain timing and test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: perf-connections-${{ matrix.config.os || runner.os }}-${{ matrix.config.r
            || matrix.r || 'release' }}-${{ matrix.config.variant || matrix.variant
            || 'optimized' }}-${{ matrix.config.policy || 'ci' }}
          path: perf-evidence
          if-no-files-found: error
          retention-days: 7.0
    strategy:
      fail-fast: false
      matrix:
        variant:
          - baseline
          - optimized
  bench:
    runs-on: ubuntu-latest
    name: token benchmark / ${{ matrix.config.variant || matrix.variant || 'optimized'
      }} / ${{ matrix.config.policy || 'ci' }}
    timeout-minutes: 120
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      GPTR_CI_PERF_VARIANT: ${{ matrix.config.variant || matrix.variant || 'optimized'
        }}
      OMP_THREAD_LIMIT: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
      RCPP_PARALLEL_NUM_THREADS: '1'
      TESTTHAT_CPUS: '2'
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rtiktoken any::pkgload
          cache: always
      - name: Prepare measured candidate (same assertions)
        shell: bash
        run: Rscript --vanilla dev/ci/perf-prepare.R
      - name: Token ratchet
        run: Rscript --vanilla dev/bench/tokens/run.R --check
      - name: Polyglot token ratchet (B and C within 10%, P24)
        run: Rscript --vanilla dev/bench/polyglot/run.R --check
      - name: Offline INFRA suite under 60 s (INFRA-24, P24)
        run: Rscript --vanilla dev/bench/perf/infra-time.R
      - name: Development tests of dev/bench (P24)
        run: Rscript --vanilla -e 'testthat::test_dir("dev/bench/tests", stop_on_failure
          = TRUE)'
      - name: Collect comparable test evidence
        if: always()
        shell: bash
        run: Rscript --vanilla dev/ci/perf-collect.R
      - name: Retain timing and test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: perf-bench-${{ matrix.config.os || runner.os }}-${{ matrix.config.r
            || matrix.r || 'release' }}-${{ matrix.config.variant || matrix.variant
            || 'optimized' }}-${{ matrix.config.policy || 'ci' }}
          path: perf-evidence
